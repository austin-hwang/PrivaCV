name: Question
description: Ask about setup, usage, or contributing.
title: "[Question]: "
labels: [question]
body:
  - type: markdown
    attributes:
      value: Do not include a real resume, application record, or exported backup.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Explain what you are trying to do and where you are stuck.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Include relevant commands or sanitized examples.
